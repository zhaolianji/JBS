<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JBS 诀别诗制</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f7f8fa;color:#333;line-height:1.5;padding-bottom:30px}
.header{background:#fff;text-align:center;padding:30px 0 20px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:100}
.brand-mark{font-size:32px;font-weight:800;letter-spacing:6px;color:#1a1a1a;margin-bottom:6px}
.brand-sub{font-size:11px;letter-spacing:2px;color:#999}
.filter-container{background:#fff;padding:15px 16px;border-bottom:1px solid #eee;position:sticky;top:95px;z-index:99}
.filter-label{font-size:12px;color:#999;margin-bottom:8px;font-weight:500}
.filter-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-tag{flex-shrink:0;padding:6px 16px;font-size:13px;border-radius:20px;border:1px solid #e0e0e0;color:#666;background:#fff;transition:all .2s;cursor:pointer}
.filter-tag.active{background:#333;color:#fff;border-color:#333}
.sub-filter-scroll{display:none;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #eee}
.sub-filter-scroll.show{display:flex}
.sub-tag{padding:4px 12px;font-size:11px;border-radius:4px;background:#f5f5f5;color:#666;border:1px solid transparent;cursor:pointer}
.sub-tag.active{background:#fff;color:#333;border-color:#333;font-weight:600}
.product-list{padding:16px;min-height:100px}
.product-card{background:#fff;border-radius:12px;margin-bottom:20px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.03)}
.gallery-wrap{position:relative}
.product-img-box{width:100%;aspect-ratio:1/1;background:#eef0f2;overflow-x:auto;scroll-snap-type:x mandatory;display:flex;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.product-img-box::-webkit-scrollbar{display:none}
.product-img-box img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block;scroll-snap-align:center}
.img-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:5px;pointer-events:none}
.img-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.25);transition:all .2s}
.img-dot.active{background:#fff;width:16px;border-radius:3px}
.product-info{padding:16px}
.info-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.product-no{font-size:12px;color:#999;letter-spacing:.5px}
.product-grade{font-size:10px;padding:2px 6px;background:#f0f0f0;color:#666;border-radius:4px}
.product-title{font-size:17px;font-weight:600;color:#1a1a1a;margin-bottom:12px;line-height:1.4}
.detail-list{margin-bottom:15px}
.detail-item{font-size:13px;color:#666;margin-bottom:6px;display:flex}
.detail-label{color:#999;min-width:45px;flex-shrink:0}
.detail-value{color:#333}
.price-tag{font-size:22px;font-weight:700;color:#1a1a1a;margin-top:10px}
.price-tag span{font-size:14px;font-weight:400}
.btn-contact{width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;margin-top:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-contact:active{opacity:.9}
.footer{background:#fff;padding:30px 20px 50px;margin-top:10px;border-top:1px solid #eee}
.custom-note{text-align:center;font-size:13px;color:#d4a853;margin-bottom:20px;font-weight:500;padding:10px;background:#fffbf0;border-radius:6px}
.footer-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#333}
.footer-item{font-size:12px;color:#888;margin-bottom:8px;line-height:1.6;padding-left:12px;position:relative}
.footer-item::before{content:"•";position:absolute;left:0;color:#ccc}
.footer-brand{text-align:center;margin-top:30px;padding-top:20px;border-top:1px dashed #eee}
.footer-brand .mark{font-size:18px;font-weight:700;letter-spacing:4px;color:#ddd}
.footer-brand .sub{font-size:10px;color:#ddd;margin-top:4px;letter-spacing:2px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:60px 20px;color:#ccc;font-size:14px}
</style>
</head>
<body>

<div class="header">
    <div class="brand-mark">J·B·S</div>
    <div class="brand-sub">诀别诗 制 · 产品销售</div>
</div>

<div class="filter-container">
    <div class="filter-label">产品分类</div>
    <div class="filter-scroll" id="mainFilter"></div>
    <div class="sub-filter-scroll" id="sub-filter-area"></div>
</div>

<div class="product-list" id="product-container">
    <div class="empty-state">暂无商品，请联系客服咨询</div>
</div>

<div class="footer">
    <div class="custom-note">若无满意现货 可联系客服进行个人定制服务</div>
    <div class="footer-title">售后须知</div>
    <div class="footer-item">签收后12小时内可退换货，货品可以拆封查看，超过时效无法退换，特殊原因可联系客服。</div>
    <div class="footer-item">人为损坏不在退换范围内。</div>
    <div class="footer-item">产品图片均为实物拍摄，因光线不同可能存在轻微色差，以实物为准。</div>
    <div class="footer-item">一经盘玩（挂瓷上色）恕不退换，请确认无误后再上手。</div>
    <div class="footer-brand">
        <div class="mark">JBS</div>
        <div class="sub">诀别诗 制</div>
    </div>
</div>

<div class="toast" id="toast">微信号 SHUN9285 已复制</div>

<script>
const DATA_URL='products.json';
let allProducts=[];
let mainCategories=[];
let subCategories={};
let currentCategory='all';
let currentSubCategory='全部规格';

const CATEGORY_ALIAS={
    '单圈圆珠':'圆珠单圈','单圈老型':'老型单圈','单圈无相':'无相单圈',
    '圆珠长串':'长串圆珠','老型长串':'长串老型','无相长串':'长串无相'
};
const FIELD_ALIAS={
    no:['编号','否'],
    name:['名称','产品名'],
    grade:['等级','细分类目','级别'],
    price:['价格','单价'],
    details:['详情'],
    image:['图片','主图'],
    category:['类目','大类目','分类']
};
function normalizeProduct(p){
    for(const k in FIELD_ALIAS){
        if(p[k]===undefined){
            const alts=FIELD_ALIAS[k];
            for(let i=0;i<alts.length;i++){
                if(p[alts[i]]!==undefined){ p[k]=p[alts[i]]; break; }
            }
        }
    }
    if(p.price!==undefined){ const n=Number(p.price); if(!isNaN(n)) p.price=n; }
    if(p.category) p.category=CATEGORY_ALIAS[p.category]||p.category;
}

async function loadProducts(){
    try{
        const r=await fetch(DATA_URL+'?t='+Date.now());
        if(!r.ok) throw new Error();
        let txt=await r.text();
        txt=txt.replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'");
        try{
            allProducts=JSON.parse(txt);
            if(!Array.isArray(allProducts)) allProducts=[];
        }catch(e2){ allProducts=[]; }
        allProducts.forEach(normalizeProduct);
    }catch(e){
        allProducts=[];
    }
    buildFilters();
    renderMainFilter();
    renderSubFilter();
    renderProducts();
}

function subsFor(list){
    const arr=['全部规格'];
    list.forEach(p=>{ if(p.grade&&arr.indexOf(p.grade)===-1) arr.push(p.grade); });
    return arr;
}

function buildFilters(){
    mainCategories=[];
    allProducts.forEach(p=>{
        if(p.category&&mainCategories.indexOf(p.category)===-1) mainCategories.push(p.category);
    });
    subCategories={'all':subsFor(allProducts)};
    mainCategories.forEach(cat=>{
        subCategories[cat]=subsFor(allProducts.filter(p=>p.category===cat));
    });
}

function renderMainFilter(){
    const box=document.getElementById('mainFilter');
    box.innerHTML='';
    const mk=(label,type)=>{
        const t=document.createElement('div');
        t.className='filter-tag'+(currentCategory===type?' active':'');
        t.innerText=label;
        t.onclick=()=>switchCategory(type);
        box.appendChild(t);
    };
    mk('全部','all');
    mainCategories.forEach(c=>mk(c,c));
}

function renderSubFilter(){
    const sc=document.getElementById('sub-filter-area');
    sc.innerHTML='';
    const items=subCategories[currentCategory]||['全部规格'];
    if(items.indexOf(currentSubCategory)===-1) currentSubCategory='全部规格';
    items.forEach(item=>{
        const tag=document.createElement('div');
        tag.className='sub-tag'+(item===currentSubCategory?' active':'');
        tag.innerText=item;
        tag.onclick=function(){
            currentSubCategory=item;
            renderSubFilter();
            renderProducts();
        };
        sc.appendChild(tag);
    });
    sc.classList.add('show');
}

function switchCategory(type){
    currentCategory=type;
    currentSubCategory='全部规格';
    renderMainFilter();
    renderSubFilter();
    renderProducts();
}

function renderProducts(){
    const c=document.getElementById('product-container');
    const f=allProducts.filter(p=>{
        const catMatch = currentCategory==='all' || p.category===currentCategory;
        const subMatch = currentSubCategory==='全部规格' || p.grade===currentSubCategory;
        return catMatch && subMatch;
    });

    if(f.length===0){
        c.innerHTML='<div class="empty-state">该分类暂无商品</div>';
        return
    }
    c.innerHTML=f.map(p=>{
        const dh=(p.details||'').split('\n').map(l=>{
            const i=l.indexOf('：');
            if(i>-1) return '<div class="detail-item"><span class="detail-label">'+l.substring(0,i+1)+'</span><span class="detail-value">'+l.substring(i+1)+'</span></div>';
            return l?'<div class="detail-item"><span class="detail-value">'+l+'</span></div>':''
        }).join('');

        const imgs = p.image.split(',').map((src,i)=>{
            const s=src.trim();
            if(i===0) return '<img src="'+s+'" alt="'+p.name+'" onerror="this.style.display=\'none\'">';
            return '<img data-src="'+s+'" alt="'+p.name+'" onerror="this.style.display=\'none\'">';
        }).join('');

        return '<div class="product-card"><div class="gallery-wrap"><div class="product-img-box">'+imgs+'</div><div class="img-dots"></div></div><div class="product-info"><div class="info-row"><span class="product-no">编号：'+(p.no||'')+'</span><span class="product-grade">'+(p.grade||'')+'</span></div><div class="product-title">'+p.name+'</div><div class="detail-list">'+dh+'</div><div class="price-tag">¥ '+p.price+'<span>/条</span></div><button class="btn-contact" onclick="copyWechat()">点击咨询</button></div></div>'
    }).join('');
    bindGallery();
    bindLazyLoad();
}

function bindLazyLoad(){
    const wraps=document.querySelectorAll('.gallery-wrap');
    const loadCard=box=>{
        box.querySelectorAll('img[data-src]').forEach(img=>{
            img.src=img.getAttribute('data-src');
            img.removeAttribute('data-src');
        });
    };
    if(!('IntersectionObserver' in window)){
        wraps.forEach(wrap=>loadCard(wrap.querySelector('.product-img-box')));
        return;
    }
    const io=new IntersectionObserver(entries=>{
        entries.forEach(en=>{
            if(en.isIntersecting){
                loadCard(en.target.querySelector('.product-img-box'));
                io.unobserve(en.target);
            }
        });
    },{rootMargin:'800px 0px'});
    wraps.forEach(wrap=>io.observe(wrap));
}

function bindGallery(){
    document.querySelectorAll('.gallery-wrap').forEach(wrap=>{
        const box=wrap.querySelector('.product-img-box');
        const dots=wrap.querySelector('.img-dots');
        const imgs=box.querySelectorAll('img');
        if(imgs.length<2){ dots.style.display='none'; return; }
        dots.style.display='';
        dots.innerHTML='';
        for(let i=0;i<imgs.length;i++){
            const d=document.createElement('span');
            d.className='img-dot'+(i===0?' active':'');
            dots.appendChild(d);
        }
        let ticking=false;
        box.addEventListener('scroll',()=>{
            if(ticking) return;
            ticking=true;
            requestAnimationFrame(()=>{
                const idx=Math.min(imgs.length-1,Math.round(box.scrollLeft/box.clientWidth));
                dots.querySelectorAll('.img-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
                ticking=false;
            });
        });
    });
}

function copyWechat(){
    const w="SHUN9285";
    if(navigator.clipboard&&window.isSecureContext){
        navigator.clipboard.writeText(w).then(showToast)
    }else{
        const ta=document.createElement("textarea");
        ta.value=w;ta.style.position="fixed";ta.style.left="-9999px";
        document.body.appendChild(ta);ta.focus();ta.select();
        try{document.execCommand('copy');showToast()}catch(e){alert("请手动添加微信号："+w)}
        document.body.removeChild(ta)
    }
}

function showToast(){
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000)
}

loadProducts();
</script>
<!--===================== 手机端体验增强脚本开始 =====================-->
<style>
    /* 顶部加载进度条 */
    #jbs-progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: linear-gradient(90deg, #4facfe, #00f2fe);
        z-index: 99999;
        transition: width 0.3s ease, opacity 0.5s ease;
        box-shadow: 0 0 8px rgba(79, 172, 254, 0.6);
    }
    #jbs-progress-bar.done { opacity: 0; }

    /* 预览遮罩层 */
    .img-preview-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.9);
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    .img-preview-overlay img {
        max-width: 95%; max-height: 95%;
        object-fit: contain;
    }
</style>

<!-- 进度条HTML结构 -->
<div id="jbs-progress-bar"></div>
<!-- 预览遮罩HTML结构 -->
<div class="img-preview-overlay" id="jbs-preview-overlay">
    <img src="" alt="preview" id="preview-img">
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const progressBar = document.getElementById('jbs-progress-bar');
    const overlay = document.getElementById('jbs-preview-overlay');
    const overlayImg = document.getElementById('preview-img');
    const images = document.querySelectorAll('img');
    
    let totalImages = images.length;
    let loadedCount = 0;

    // 1. 更新顶部进度条
    function updateProgress() {
        loadedCount++;
        const percent = Math.min((loadedCount / totalImages) * 100, 100);
        progressBar.style.width = percent + '%';
        if (loadedCount >= totalImages) {
            setTimeout(() => progressBar.classList.add('done'), 800);
        }
    }

    // 2. 处理每张图：淡入动画 + 加载提示 + 失败重试
    images.forEach(img => {
        // 排除宽高为0的隐藏图标
        if (img.width === 0 && img.height === 0) return;

        const loadingMsg = document.createElement('div');
        loadingMsg.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#999;font-size:13px;text-align:center;pointer-events:auto;cursor:pointer;background:rgba(255,255,255,0.8);padding:6px 12px;border-radius:4px;z-index:10;user-select:none;';
        loadingMsg.textContent = '正在加载...';

        img.style.opacity = '0';
        img.style.transition = 'opacity 0.6s ease';

        // 确保父级是相对定位，以便loadingMsg居中
        let parent = img.parentNode;
        if (window.getComputedStyle(parent).position === 'static') {
            parent.style.position = 'relative';
        }
        parent.appendChild(loadingMsg);

        function hideLoading() {
            if (loadingMsg.parentNode) loadingMsg.parentNode.removeChild(loadingMsg);
        }

        // 成功加载
        img.onload = function() {
            hideLoading();
            this.style.opacity = '1';
            updateProgress();
        };

        // 加载失败
        img.onerror = function() {
            loadingMsg.textContent = '加载失败\n(点击重试)';
            loadingMsg.style.color = '#ff6b6b';
            loadingMsg.style.background = 'rgba(255,240,240,0.9)';
            
            // 点击重新加载
            loadingMsg.onclick = function(e) {
                e.stopPropagation(); // 防止触发图片放大
                loadingMsg.textContent = '正在加载...';
                loadingMsg.style.color = '#999';
                loadingMsg.style.background = 'rgba(255,255,255,0.8)';
                img.src = img.src; // 重新触发加载
            };
            updateProgress();
        };
    });

    // 3. 图片点击放大
    images.forEach(img => {
        img.addEventListener('click', function(e) {
            e.stopPropagation();
            overlayImg.src = this.src;
            overlay.style.display = 'flex';
        });
    });

    // 4. 点击遮罩关闭
    overlay.addEventListener('click', function() {
        this.style.display = 'none';
    });

    // 如果页面没有图片，直接跑满进度条
    if (totalImages === 0) {
        progressBar.style.width = '100%';
        setTimeout(() => progressBar.classList.add('done'), 500);
    }
});
</script>
<!--===================== 手机端体验增强脚本结束 =====================-->
